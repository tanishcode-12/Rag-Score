[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-score"
version = "0.1.0"
description = "Framework-agnostic RAG evaluation: zero lock-in, zero forced API cost."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tanish Shetty" }]
keywords = ["rag", "llm", "evaluation", "retrieval", "langchain", "llamaindex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

# Core install stays deliberately tiny - this is what makes retrieval
# metrics usable with zero API keys and near-zero install footprint.
dependencies = [
  "pydantic>=2.0",
  "click>=8.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
report = ["jinja2>=3.0"]
bi = ["pandas>=2.0"]
all = ["pyyaml>=6.0", "openai>=1.0", "anthropic>=0.30", "jinja2>=3.0", "pandas>=2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
rageval = "rag_score.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["rag_score"]

[tool.ruff]
line-length = 100
target-version = "py310"
